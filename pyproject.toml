[project]
name = "roosterly-agent"
version = "0.1.0"
description = "Support ticket agent for the Roosterly helpdesk"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
